# 로컬 개발용 인프라 정의. 컴퓨터 3대가 이 파일 하나로 같은 DB 환경의 띄운다.
# 실행: docker compose up -d / 중지: docker compose down
services:
  mariadb:
    image: mariadb:11.4                  # LTS 버전으로 고정 (기존 11.3 덤프와 호환)
    container_name: tms-mariadb          # docker exec 등에서 부를 이름
    restart: unless-stopped              # Docker Desktop을 켜면 자동으로 다시 시작
    ports:
      - "3308:3306"                      # 내 PC 3308 → 컨테이너 3306 (기존 로컬 MariaDB 3306과 충돌 방지, 3306, 3307은 이 PC에서 이미 사용 중)
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}   # .env 파일에서 읽음
      MARIADB_DATABASE: tms                        # 첫 실행 시 tms DB 자동 생성
      MARIADB_USER: ${DB_USERNAME}                 # 애플리케이션 전용 계정 자동 생성
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul                               # 컨테이너 OS 시간대
    command:
      - --character-set-server=utf8mb4             # 한글·이모지 저장을 위한 문자셋
      - --collation-server=utf8mb4_unicode_ci      # 기존 테이블과 같은 정렬 규칙
      - --default-time-zone=+09:00                 # current_timestamp()를 한국 시간으로
    volumes:
      - tms-mariadb-data:/var/lib/mysql            # DB 데이터 보관 (컨테이너를 지워도 유지)
      - ./docker/mariadb/initdb:/docker-entrypoint-initdb.d:ro   # 첫 실행 시 자동 실행할 SQL
    healthcheck:                                   # DB가 실제로 접속 가능한 상태인지 주기적으로 확인
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tms-mariadb-data:                                # Docker가 관리하는 이름 있는 저장 공간